<!--
  Copy of the consent and analytics part of Site settings > Custom code > Head, as live on
  cocos-organic.com. The rest of the Head block (font preconnects, twitter:card and the
  Organization/WebSite JSON-LD) is not repeated here.

  Keep the CMP first in the head: it has to load before the other tags so it can hold them back.

  How consent works:
  - Termageddon / Usercentrics settings ID ej6F3FADfoIfCM. Services (Google Analytics, Google Maps,
    Campaign Monitor, Adobe Fonts, Cloudflare, Webflow and so on) are managed in Termageddon, not here.
  - A script tagged type="text/plain" data-usercentrics="<service name>" is held back until the visitor
    allows that service. The name must match the service name in Termageddon exactly.
  - The stockist map waits for the "Google Maps" service in src/modules/stockist-map.js.
-->

<!-- CMP -->
<link rel='preconnect' href='//privacy-proxy.usercentrics.eu'>
<link rel='preload' href='//privacy-proxy.usercentrics.eu/latest/uc-block.bundle.js' as='script'>
<script type='application/javascript' src='https://privacy-proxy.usercentrics.eu/latest/uc-block.bundle.js'></script>
<script id='usercentrics-cmp' src='https://app.usercentrics.eu/browser-ui/latest/loader.js' data-settings-id='ej6F3FADfoIfCM' async></script>
<script>uc.setCustomTranslations('https://termageddon.ams3.cdn.digitaloceanspaces.com/translations/');</script>

<!-- Google Analytics (GA4): held back until the visitor allows the "Google Analytics" service -->
<script type="text/plain" data-usercentrics="Google Analytics" async src="https://www.googletagmanager.com/gtag/js?id=G-Z4ZBHR8YEB"></script>
<script type="text/plain" data-usercentrics="Google Analytics">
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Z4ZBHR8YEB');
</script>
