<!--
  Webflow > Site settings > Custom code > HEAD (footer is left empty)
  Loads dist/site.css (render-blocking, so the html font-size is right before first paint)
  and dist/site.js. Bump VERSION to release (must be a pushed git tag).
  ?dev switches this browser to localhost, ?dev=off switches back.
-->
<script>
(() => {
  const VERSION = 'v1.1.0';
  const REPO = 'https://cdn.jsdelivr.net/gh/pixelsilo/cocos-organic@' + VERSION + '/dist';
  const LOCAL = 'http://127.0.0.1:5500';
  const KEY = 'ps-dev';
  const q = new URLSearchParams(location.search).get('dev');
  try { if (q !== null) localStorage.setItem(KEY, q === 'off' ? '' : '1'); } catch (e) {}
  let dev = false;
  try { dev = localStorage.getItem(KEY) === '1'; } catch (e) {}
  if (dev) console.info('[cocos] DEV mode, loading from', LOCAL, '(?dev=off to exit)');
  const base = dev ? LOCAL : REPO;
  const bust = dev ? '?t=' + Date.now() : '';
  // parser-inserted stylesheet blocks rendering until it loads, avoiding a layout jump
  document.write('<link rel="stylesheet" href="' + base + '/site.css' + bust + '">');
  const s = document.createElement('script');
  s.src = base + '/site.js' + bust;
  document.head.appendChild(s);
})();
</script>
